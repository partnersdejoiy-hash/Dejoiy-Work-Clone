openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: dashboard
    description: Dashboard operations
  - name: users
    description: User/Employee operations
  - name: tasks
    description: Task operations
  - name: notifications
    description: Notification operations
  - name: leave-requests
    description: Leave request operations
  - name: expenses
    description: Expense operations
  - name: it-tickets
    description: IT ticket operations
  - name: announcements
    description: Announcement operations
  - name: analytics
    description: Analytics operations
  - name: goals
    description: Goal operations
  - name: performance-reviews
    description: Performance review operations
  - name: payroll
    description: Payroll operations
  - name: recruitment
    description: Recruitment operations
  - name: timesheets
    description: Timesheet operations
  - name: calendar
    description: Calendar operations
  - name: assets
    description: Asset operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
