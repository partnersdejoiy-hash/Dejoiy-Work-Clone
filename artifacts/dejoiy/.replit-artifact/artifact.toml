kind = "web"
previewPath = "/"
title = "Dejoiy"
version = "1.0.0"
id = "artifacts/dejoiy"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21611

[services.development]
run = "pnpm --filter @workspace/dejoiy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dejoiy", "run", "build" ]
publicDir = "artifacts/dejoiy/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21611"
BASE_PATH = "/"
